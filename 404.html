<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — MovieSmash</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0B0D; --gold:#E8B84B; --velvet:#9A2846; --cream:#F5EDE0; --teal:#52948C; --line:#322E36; }
  body{ background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh; margin:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; }
  .wrap{ max-width:480px; }
  .code{ font-family:'Bebas Neue', sans-serif; font-size:140px; color:var(--gold); line-height:1; text-shadow:0 0 30px rgba(232,184,74,0.3); margin:0; }
  h1{ font-family:'Bebas Neue', sans-serif; font-size:32px; letter-spacing:0.02em; margin:10px 0 14px; }
  p{ color:var(--teal); font-family:'JetBrains Mono', monospace; font-size:13px; margin-bottom:30px; }
  a{ display:inline-block; background:var(--gold); color:#1a1500; font-weight:700; padding:12px 26px; border-radius:20px; text-decoration:none; font-size:14px; }
  a:hover{ filter:brightness(1.08); }
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>Ce film n'est pas au générique</h1>
  <p>La page que tu cherches n'existe pas — ou a perdu son duel.</p>
  <a href="/">Retour à MovieSmash</a>
</div>
</body>
</html>
