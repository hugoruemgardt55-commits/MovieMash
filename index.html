let movies = {};
let currentPair = null;

function slugify(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Math.random().toString(36).slice(2,6);
}
function expectedScore(a, b){ return 1 / (1 + Math.pow(10, (b - a) / 400)); }

async function loadData(){
  const statusLine = document.getElementById('statusLine');
  const { data, error } = await supabaseClient.from('movies').select('*');
  if(error){
    statusLine.textContent = "ERREUR (lecture) : " + (error.message || JSON.stringify(error));
    console.error(error);
    return false;
  }
  (data || []).forEach(m => movies[m.id] = m);

  // Ajoute les films de la liste qui ne sont pas encore dans la base
  // (que la table soit vide au départ, ou qu'on ait juste rajouté des titres au code)
  const missing = SEED_MOVIES.filter(m => !movies[m.id]);
  if(missing.length > 0){
    statusLine.textContent = `Ajout de ${missing.length} nouveau(x) film(s)…`;
    const { error: seedError } = await supabaseClient.from('movies').upsert(missing, { onConflict: 'id', ignoreDuplicates: true });
    if(seedError){
      statusLine.textContent = "ERREUR (remplissage) : " + (seedError.message || JSON.stringify(seedError));
      console.error(seedError);
      return false;
    }
    missing.forEach(m => movies[m.id] = m);
  }

  if(Object.keys(movies).length === 0){
    statusLine.textContent = "Aucun film n'a pu être chargé — vérifie les policies RLS dans Supabase.";
    return false;
  }

  // Récupère les affiches manquantes en tâche de fond (n'empêche pas de commencer à voter)
  if(TMDB_API_KEY) fetchMissingPosters();

  return true;
}

async function fetchMissingPosters(){
  const toFetch = Object.values(movies).filter(m => !m.poster_url);
  for(const movie of toFetch){
    try{
      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movie.title)}&year=${movie.year}&language=fr-FR`);
      const json = await res.json();
      const result = (json.results && json.results[0]) || null;
      if(result && result.poster_path){
        const posterUrl = `https://image.tmdb.org/t/p/w500${result.poster_path}`;
        movies[movie.id].poster_url = posterUrl;
        await supabaseClient.from('movies').update({poster_url: posterUrl}).eq('id', movie.id);
        // Réaffiche si le film concerné est visible dans le duel en cours
        if(currentPair && currentPair.includes(movie.id)){ renderArena(); }
      }
    }catch(e){
      console.error('Affiche introuvable pour', movie.title, e);
    }
  }
}

let streaks = {}; // compteur de victoires consécutives, remis à zéro à chaque rechargement de page

function pickPair(){
  const ids = Object.keys(movies);
  if(ids.length < 2) return null;
  let a = ids[Math.floor(Math.random()*ids.length)];
  let b = ids[Math.floor(Math.random()*ids.length)];
  let guard = 0;
  while(b === a && guard < 20){ b = ids[Math.floor(Math.random()*ids.length)]; guard++; }
  return [a, b];
}

function pickChallenger(excludeId){
  const ids = Object.keys(movies).filter(id => id !== excludeId);
  if(ids.length === 0) return null;
  return ids[Math.floor(Math.random()*ids.length)];
}

function renderArena(){
  const arena = document.getElementById('arena');
  if(!currentPair){
    arena.innerHTML = '<div class="empty-msg">Ajoute au moins deux films pour commencer à voter.</div>';
    return;
  }
  const [idA, idB] = currentPair;
  const a = movies[idA], b = movies[idB];
  const streakBadge = (id) => (streaks[id] >= 2)
    ? `<div class="streak-badge">🔥 ${streaks[id]} victoires</div>`
    : '';
  const cardStyle = (m) => m.poster_url
    ? `style="background-image: linear-gradient(180deg, rgba(11,11,13,0.15) 45%, rgba(11,11,13,0.97) 92%), url('${m.poster_url}'); background-size: cover; background-position: center top;"`
    : '';
  arena.innerHTML = `
    <div class="card" id="cardA" data-id="${idA}" ${cardStyle(a)}>
      <div class="genre-tag">${a.genre}</div><div class="year">${a.year}</div>
      <div class="title">${a.title}</div><div class="blurb">${a.blurb}</div>
      ${streakBadge(idA)}
    </div>
    <div class="vs-badge">VS</div>
    <div class="card" id="cardB" data-id="${idB}" ${cardStyle(b)}>
      <div class="genre-tag">${b.genre}</div><div class="year">${b.year}</div>
      <div class="title">${b.title}</div><div class="blurb">${b.blurb}</div>
      ${streakBadge(idB)}
    </div>`;
  document.getElementById('cardA').addEventListener('click', () => handleVote(idA, idB));
  document.getElementById('cardB').addEventListener('click', () => handleVote(idB, idA));
}

async function handleVote(winnerId, loserId){
  const statusLine = document.getElementById('statusLine');
  statusLine.textContent = 'Enregistrement du vote…';
  const winner = movies[winnerId], loser = movies[loserId];
  const K = 32;
  const expWin = expectedScore(winner.rating, loser.rating);
  const expLose = expectedScore(loser.rating, winner.rating);
  winner.rating = Math.round(winner.rating + K * (1 - expWin));
  loser.rating = Math.round(loser.rating + K * (0 - expLose));
  winner.votes += 1; loser.votes += 1;

  const winnerSlot = winnerId === currentPair[0] ? 0 : 1;
  const winnerCard = document.getElementById(winnerSlot === 0 ? 'cardA' : 'cardB');
  if(winnerCard) winnerCard.classList.add('flash');

  const { error: e1 } = await supabaseClient.from('movies').update({rating: winner.rating, votes: winner.votes}).eq('id', winnerId);
  const { error: e2 } = await supabaseClient.from('movies').update({rating: loser.rating, votes: loser.votes}).eq('id', loserId);
  statusLine.textContent = (e1 || e2) ? "Le vote n'a pas pu être enregistré. Réessaie." : 'Vote enregistré. Le champion attend son prochain défi…';

  streaks[winnerId] = (streaks[winnerId] || 0) + 1;
  streaks[loserId] = 0;

  const challengerId = pickChallenger(winnerId);
  if(challengerId === null){
    currentPair = null;
  } else {
    currentPair = winnerSlot === 0 ? [winnerId, challengerId] : [challengerId, winnerId];
  }
  renderArena();
  renderLeaderboard();
}

function renderLeaderboard(){
  const wrap = document.getElementById('leaderboardWrap');
  const list = Object.values(movies).sort((x,y) => y.rating - x.rating);
  if(list.length === 0){ wrap.innerHTML = '<div class="empty-msg">Aucun film pour le moment.</div>'; return; }
  const totalVotes = list.reduce((sum,m) => sum + m.votes, 0) / 2;
  document.getElementById('voteCount').textContent = `${Math.round(totalVotes)} votes au total`;
  wrap.innerHTML = `<table><thead><tr><th>Rang</th><th>Film</th><th style="text-align:right;">Score</th><th style="text-align:right;">Votes</th></tr></thead>
    <tbody>${list.map((m, i) => `<tr><td class="rank">#${i+1}</td><td>${m.title} <span style="color:var(--muted); font-size:12px;">(${m.year})</span></td><td class="rating">${m.rating}</td><td class="votes">${m.votes}</td></tr>`).join('')}</tbody></table>`;
}

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const title = document.getElementById('inpTitle').value.trim();
  const year = parseInt(document.getElementById('inpYear').value, 10);
  const genre = document.getElementById('inpGenre').value.trim();
  const blurb = document.getElementById('inpBlurb').value.trim();
  if(!title || !year || !genre || !blurb) return;
  const id = slugify(title);
  const newMovie = {id, title, year, genre, blurb, rating: 1500, votes: 0};
  const { error } = await supabaseClient.from('movies').insert([newMovie]);
  const statusLine = document.getElementById('statusLine');
  if(error){
    statusLine.textContent = "Le film n'a pas pu être ajouté. Réessaie.";
    console.error(error);
  } else {
    movies[id] = newMovie;
    statusLine.textContent = `"${title}" a rejoint l'arène.`;
    if(!currentPair) currentPair = pickPair();
  }
  e.target.reset();
  renderArena();
  renderLeaderboard();
});

(async function init(){
  const ok = await loadData();
  if(!ok) return;
  currentPair = pickPair();
  document.getElementById('statusLine').textContent = '';
  renderArena();
  renderLeaderboard();
})();
</script>
